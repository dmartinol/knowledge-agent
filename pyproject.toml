[project]
name = "knowledge-agent"
version = "0.1.0"
description = "An A2A knowledge-search agent backed by LCORE"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "a2a-sdk[http-server]>=0.3.4,<0.4.0",
    "pydantic>=2.11.3",
    "uvicorn>=0.30",
]

[project.scripts]
knowledge-agent = "knowledge_agent.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.2",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.13",
    "pyright>=1.1.401",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_agent"]
