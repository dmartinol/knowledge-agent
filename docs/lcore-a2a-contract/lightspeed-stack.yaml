name: Lightspeed Core Service (LCS)
service:
  host: 0.0.0.0
  port: 8080
  base_url: http://localhost:8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
ogx:
  use_as_library_client: true
  config:
    baseline: byo-llm
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"
conversation_cache:
  type: "sqlite"
  sqlite:
    db_path: "/tmp/data/conversation-cache.db"
authentication:
  module: "noop"
inference:
  default_provider: openai
  default_model: "rits/zai-org/glm-5-3"
  providers:
    - type: openai
      id: openai
      # LCORE model discovery reads `config`; the OGX run.yaml it synthesizes
      # ignores `config` and needs `api_key_env` plus `extra.base_url`.
      config:
        api_key: ${env.ENMAAS_KEY}
        base_url: ${env.OPENAI_BASE_URL}
      api_key_env: ENMAAS_KEY
      extra:
        base_url: ${env.OPENAI_BASE_URL}
      allowed_models:
        - ${env.E2E_OPENAI_MODEL:=rits/zai-org/glm-5-3}
#mcp_servers:
  #- name: okp
    #url: ${env.RH_SERVER_OKP}/mcp # full MCP endpoint, ending in /mcp
rag:
  retrieval:
    tool:
      sources:
        - okp
      max_chunks: 1
  okp:
    rhokp_url: ${env.RH_SERVER_OKP:=http://localhost:8081/solr}
    offline: true
    max_chunks: 5
    search_mode: keyword
customization:
  agent_card_config:
    name: "Lightspeed Assistant"
    description: "Answers questions using Red Hat knowledge sources."
    provider:
      organization: "Red Hat"
      url: "https://www.redhat.com"
    skills:
      - id: "red-hat-knowledge"
        name: "Red Hat Knowledge Search"
        description: "Answers questions using Red Hat documentation."
        tags: ["red-hat", "knowledge"]
        inputModes: ["text/plain"]
        outputModes: ["text/plain"]
    security: []

