nameOverride: ""
fullnameOverride: ""

image:
  # In-cluster registry used when a component leaves its repository empty.
  internalRegistry: image-registry.openshift-image-registry.svc:5000

agent:
  image:
    # Empty pulls <internalRegistry>/<namespace>/<stream>. Set a full
    # repository (without tag) to use an external registry instead.
    repository: ""
    stream: knowledge-agent-demo
    tag: latest
    pullPolicy: Always
  port: 8081
  skillsDir: /app/skills
  # Upstream LCORE retrieval transport: "a2a" (code default) or "rest".
  # The demo uses "rest" so answers carry referenced_documents as Sources.
  retriever: rest
  # Set this when the Route host is known so the published Agent Card carries
  # the external URL. When empty, the card advertises http://0.0.0.0:8081.
  publicUrl: ""
  route:
    enabled: true
    host: ""
    # Must exceed the longest blocking A2A call the route carries.
    timeout: 240s
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  llm:
    # Required. OpenAI-compatible endpoint and model owned by the agent.
    baseUrl: ""
    model: ""
    timeoutSeconds: 60
    requestLimit: 6
    totalTokensLimit: 60000
  workflow:
    maxRounds: 2
    maxMaterialChars: 12000
    # LCORE runs a bounded tool loop (see lcore.inference), but a query that
    # takes two retrieval passes still needs well over a minute on the demo
    # model. Keep the upstream timeout above that and both below the Route
    # timeout, or blocking calls fail just before LCORE answers.
    upstreamTimeoutSeconds: 150
    taskDeadlineSeconds: 210
    maxConcurrentTasks: 4
  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
      failureThreshold: 3

ui:
  enabled: true
  image:
    repository: ""
    stream: knowledge-agent-demo-ui
    tag: latest
    pullPolicy: Always
  port: 8080
  route:
    enabled: true
    host: ""
    # Must exceed the longest blocking A2A call the route carries.
    timeout: 240s
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

lcore:
  enabled: true
  # Used when enabled=false: base URL of an LCORE deployment you manage.
  externalUrl: ""
  image:
    repository: quay.io/lightspeed-core/lightspeed-stack
    tag: dev-20261126-ab82ea4
    pullPolicy: IfNotPresent
  port: 8080
  # URL published in the LCORE Agent Card. Empty means the in-cluster Service.
  serviceBaseUrl: ""
  inference:
    defaultModel: rits/zai-org/glm-5-3
    # Empty means "allow only defaultModel".
    allowedModels: []
    # Environment variables the LCORE container reads for the provider.
    apiKeyEnv: OPENAI_API_KEY
    baseUrlEnv: OPENAI_BASE_URL
    # LCORE runs its own tool loop and a chatty model can keep asking
    # file_search for the same question, so one /v1/query outlives the agent's
    # upstream timeout. These cap model requests and successful tool calls per
    # query; LCORE answers with whatever it retrieved when a cap is reached.
    maxInferIters: 5
    maxToolCalls: 3
  rag:
    sources:
      - okp
    maxChunks: 5
    # LCORE applies one search mode to the shared file_search tool. Semantic is
    # what this demo's RHOKP index answers, and it is the only mode the BYOK
    # FAISS store supports.
    searchMode: semantic
    offline: true
    # A second, non-Red-Hat corpus served from a static FAISS index. The index
    # and its embedding model live in a derived LCORE image (demo/lcore-rag), so
    # nothing is ingested or downloaded at runtime. When enabled, the store is
    # appended to rag.retrieval.tool.sources next to OKP, so one file_search
    # covers both and Sources name the store that answered.
    byok:
      enabled: false
      # Must match the name the index was generated with. When enabled it is
      # also the entry appended to rag.retrieval.tool.sources.
      ragId: aurora-docs
      # Reported by the generator next to the database; it must match the ids
      # baked into demo/lcore-rag/faiss_store.db.
      vectorDbId: vs_644cd408-0572-49d4-84bc-c61a67a14f10
      # Local path of the baked sentence-transformers model inside the image.
      embeddingModel: /app-root/embeddings/all-mpnet-base-v2
      embeddingDimension: 768
      # Writable runtime copy; the image keeps the original read-only at
      # /app-root/lcore-rag/faiss_store.db.
      dbPath: /tmp/lcore-rag/faiss_store.db
      image:
        # Empty pulls <internalRegistry>/<namespace>/<stream>.
        repository: ""
        stream: knowledge-agent-lcore-rag
        tag: latest
        pullPolicy: Always
  agentCard:
    name: Lightspeed Assistant
    description: Answers questions using Red Hat knowledge sources.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

rhokp:
  # Base URL LCORE uses to reach RHOKP. LCORE also builds the document URLs in
  # its citations from this value, so point it at whatever LCORE can reach.
  internalUrl: "http://rhokp.rhokp.svc.cluster.local:8080"
  # Public base for the same documents, normally RHOKP's Route, e.g.
  # https://rhokp-rhokp.apps.<cluster-domain>. When set, the agent rewrites
  # Source URLs that start with internalUrl so callers can open them. Empty
  # leaves LCORE's URLs untouched. Only the two strings are compared: the agent
  # never resolves or discovers the Route itself.
  publicUrl: ""

secrets:
  # Name of an existing Secret. The chart never renders secret material.
  existingSecret: ""
  keys:
    agentApiKey: AGENT_LLM_API_KEY
    lcoreApiKey: OPENAI_API_KEY
    lcoreBaseUrl: OPENAI_BASE_URL

networkPolicy:
  enabled: true
  # Namespace that hosts the OpenShift ingress router.
  ingressNamespaceSelector:
    network.openshift.io/policy-group: ingress
  # RHOKP namespace for LCORE egress. Only used when lcore.enabled is true.
  rhokpNamespace: rhokp
  # Some clusters re-originate DNS queries leaving an egress-isolated pod, so
  # port-53 rules never match and only an unrestricted egress rule works. Set
  # this to true on such clusters; the console then keeps working but its
  # egress is no longer scoped to the agent.
  uiAllowAnyEgress: false
  externalEgress:
    # The model provider and (when enabled) RHOKP are reachable through this
    # policy. Empty cidrs allow every egress destination on every port; list
    # CIDRs to narrow it to the model endpoint networks.
    enabled: true
    cidrs: []
